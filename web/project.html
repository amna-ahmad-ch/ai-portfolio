<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask My Docs | Amna Ahmad</title>
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="../../">Amna Ahmad</a>
    <nav>
      <a href="../../">Projects</a>
      <a href="https://github.com/amna-ahmad-ch/ai-portfolio">GitHub</a>
    </nav>
  </header>
  <main>
    <h1>Ask My Docs</h1>
    <p class="lede">Twelve public-domain food-safety sheets, searched sixteen ways. The winner is LLM chunks reranked by Groq. These are US rules.</p>

    {{ask}}

    <section>
      <h2>Retrieval comparison</h2>
      <p class="note">{{stats}}</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Chunks</th><th>Search</th><th class="num">Hits</th><th class="num">MRR</th></tr>
          </thead>
          <tbody>
            {{rows}}
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
