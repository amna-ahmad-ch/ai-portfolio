<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask My Docs | Amna Ahmad</title>
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow"><a href="../../">Amna Ahmad</a></p>
      <h1>Ask My Docs</h1>
      <p class="lede">Twelve public-domain food-safety sheets, searched sixteen ways. The table is the saved evaluation. The winner is LLM chunks reranked by Groq. These are US rules.</p>
    </header>

    {{ask}}

    <section>
      <h2>Retrieval comparison</h2>
      <p class="note">{{stats}}</p>
      <div class="panel table-wrap">
        <table>
          <thead>
            <tr><th>Chunks</th><th>Search</th><th>Hits</th><th>MRR</th></tr>
          </thead>
          <tbody>
            {{rows}}
          </tbody>
        </table>
      </div>
    </section>
    <footer>
      <a href="../../">All projects</a>
      <a href="https://github.com/amna-ahmad-ch/ai-portfolio">GitHub</a>
    </footer>
  </main>
</body>
</html>
